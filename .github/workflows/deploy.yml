name: Deploy Alpha-Engine to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Force Sync bot.py to PythonAnywhere
      env:
        PA_TOKEN: ${{ secrets.PA_API_TOKEN }}
      run: |
        curl -X POST "https://pythonanywhere.com" \
          -H "Authorization: Token $PA_TOKEN" \
          -F "content=@bot.py"
